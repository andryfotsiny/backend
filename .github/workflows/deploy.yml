name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          # On cible le fichier dans le sous-dossier backend
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (Validation)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q backend/app backend/main_ip.py

      - name: Deploy on server (non-Docker)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            
            # 1. Récupérer le code
            git pull origin main
            
            # 2. Configurer le .env (on suppose qu'on est à la racine du projet)
            echo "${{ secrets.ENV_FILE }}" > backend/.env
            chmod 600 backend/.env
            
            # 3. Gérer l'environnement virtuel et dépendances
            # On vérifie si le venv existe, sinon on le crée
            if [ ! -d "venv" ]; then python3.11 -m venv venv; fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r backend/requirements.txt
            
            # 4. Migrations et Redémarrage
            cd backend
            alembic upgrade head
            
            # On utilise sudo seulement si nécessaire pour systemctl
            sudo systemctl restart dyleth-backend